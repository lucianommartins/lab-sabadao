apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  selector:
    app: vllm
  ports:
  - name: http
    port: 8000
    targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-deployment
spec:
  replicas: 4
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      hostIPC: true # Universal NVLink shared memory / multi-GPU IPC
      tolerations:
      - key: "nvidia.com/gpu" # Tolerates any NVIDIA GPU taint
        operator: "Exists"
        effect: "NoSchedule"
      - key: "kubernetes.io/arch" # Tolerates both arm64 (Grace Blackwell) and amd64 (x86_64) taints
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: vllm
        image: vllm/vllm-openai:nightly
        imagePullPolicy: IfNotPresent
        command:
        - "vllm"
        - "serve"
        args:
        - "$(MODEL_NAME)"
        - "--tensor-parallel-size"
        - "2"
        - "--data-parallel-size"
        - "2"
        - "--max-model-len"
        - "262144"
        - "--gpu-memory-utilization"
        - "0.95"
        - "--enable-chunked-prefill"
        - "--disable-custom-all-reduce"
        - "--reasoning-parser"
        - "gemma4"
        - "--enable-auto-tool-choice"
        - "--tool-call-parser"
        - "gemma4"
        - "--trust-remote-code"
        - "--hf-overrides"
        - '{"vision_config": {"default_output_length": 1120}}'
        - "--mm-processor-kwargs"
        - '{"max_soft_tokens": 1120}'
        - "--limit-mm-per-prompt"
        - '{"image": 8}'
        - "--port"
        - "8000"
        env:
        - name: MODEL_NAME
          value: "" # Dynamically injected at runtime
        - name: HF_HOME
          value: "/root/.cache/huggingface"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: token
              optional: true
        - name: NCCL_NVLS_ENABLE
          value: "0" # Disables NVLS multicast on GKE virtualized GPU instances
        - name: NCCL_DEBUG
          value: "INFO"
        - name: NCCL_SOCKET_IFNAME
          value: "eth0,lo"
        resources:
          limits:
            nvidia.com/gpu: "4"
            memory: "350Gi"
          requests:
            nvidia.com/gpu: "4"
            memory: "250Gi"
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 30
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: hf-cache
          mountPath: /root/.cache/huggingface
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
      - name: hf-cache
        hostPath:
          path: /var/cache/huggingface
          type: DirectoryOrCreate
